<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎤 Speaker Notes — CSK Workshop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 24px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #334155;
    }
    .slide-info { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
    .slide-num { font-size: 36px; font-weight: bold; color: #38bdf8; }
    .slide-title { font-size: 18px; font-weight: 600; margin-top: 4px; color: #e2e8f0; }
    .nav { display: flex; gap: 8px; }
    .nav button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }
    .nav button.prev { background: #334155; color: white; }
    .nav button.prev:hover { background: #475569; }
    .nav button.next { background: #0ea5e9; color: white; }
    .nav button.next:hover { background: #0284c7; }

    .timer-section {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
    }
    .timer {
      font-size: 64px;
      font-weight: bold;
      color: #22c55e;
      font-variant-numeric: tabular-nums;
      font-family: 'SF Mono', Monaco, monospace;
    }
    .timer.warning { color: #eab308; }
    .timer.danger { color: #ef4444; }
    .timer-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
    }
    .timer-controls button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #334155;
      color: white;
      font-size: 14px;
      transition: all 0.15s;
    }
    .timer-controls button:hover { background: #475569; }
    .timer-controls button.active { background: #16a34a; }

    .notes {
      background: #1e293b;
      border-radius: 12px;
      padding: 24px;
      line-height: 1.8;
      font-size: 17px;
    }
    .notes p { margin-bottom: 16px; }
    .notes ul { padding-left: 24px; margin-bottom: 8px; }
    .notes li { margin-bottom: 10px; }
    .notes strong { color: #fbbf24; }
    .notes code {
      background: #334155;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 15px;
      font-family: 'SF Mono', Monaco, monospace;
    }

    .keyboard-hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #334155;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      color: #94a3b8;
    }
    .keyboard-hint kbd {
      background: #475569;
      padding: 2px 6px;
      border-radius: 4px;
      margin: 0 2px;
    }

    .connecting {
      text-align: center;
      padding: 60px;
      color: #64748b;
    }
    .connecting .icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="connecting" id="connecting">
    <div class="icon">🔗</div>
    <p>Connecting to slides...</p>
    <p style="margin-top: 8px; font-size: 14px;">Open slides.html in another window</p>
  </div>

  <div id="main" style="display: none;">
    <div class="header">
      <div>
        <div class="slide-info">Slide</div>
        <div class="slide-num" id="slideNum">1 / 39</div>
        <div class="slide-title" id="slideTitle">Loading...</div>
      </div>
      <div class="nav">
        <button class="prev" id="prevBtn">← Prev</button>
        <button class="next" id="nextBtn">Next →</button>
      </div>
    </div>
    <div class="timer-section">
      <div class="timer" id="timer">00:00</div>
      <div class="timer-controls">
        <button id="resetBtn">Reset</button>
        <button id="timerBtn">Start</button>
      </div>
    </div>
    <div class="notes" id="notes">Loading speaker notes...</div>
  </div>

  <div class="keyboard-hint">
    <kbd>←</kbd> / <kbd>→</kbd> Navigate &nbsp;|&nbsp; <kbd>Space</kbd> Next
  </div>

  <script>
    // BroadcastChannel for communication with slides
    const bc = new BroadcastChannel('csk2-presenter');

    let currentSlide = 0;
    let totalSlides = 0;
    let slideTitle = '';
    let speakerNotes = [];

    // Timer state
    let timerSeconds = 0;
    let timerRunning = false;
    let timerInterval = null;

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function updateTimerDisplay() {
      const timerEl = document.getElementById('timer');
      if (timerEl) {
        timerEl.textContent = formatTime(timerSeconds);
        timerEl.className = 'timer' + (timerSeconds > 2700 ? ' danger' : timerSeconds > 2400 ? ' warning' : '');
      }
    }

    function tickTimer() {
      timerSeconds++;
      updateTimerDisplay();
    }

    function toggleTimer() {
      timerRunning = !timerRunning;
      const btn = document.getElementById('timerBtn');
      if (btn) {
        btn.textContent = timerRunning ? 'Pause' : 'Start';
        btn.classList.toggle('active', timerRunning);
      }
      if (timerRunning) {
        timerInterval = setInterval(tickTimer, 1000);
      } else {
        clearInterval(timerInterval);
      }
    }

    function resetTimer() {
      timerSeconds = 0;
      updateTimerDisplay();
    }

    function updateUI() {
      document.getElementById('connecting').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      document.getElementById('slideNum').textContent = (currentSlide + 1) + ' / ' + totalSlides;
      document.getElementById('slideTitle').textContent = slideTitle;
      // Notes are hardcoded HTML from speakerNotes array (trusted content, not user input)
      const notesContent = speakerNotes[currentSlide] || '<p>No notes for this slide.</p>';
      document.getElementById('notes').innerHTML = notesContent;
    }

    function prevSlide() {
      bc.postMessage({ type: 'prevSlide' });
    }

    function nextSlide() {
      bc.postMessage({ type: 'nextSlide' });
    }

    // Button handlers
    document.getElementById('prevBtn').onclick = prevSlide;
    document.getElementById('nextBtn').onclick = nextSlide;
    document.getElementById('resetBtn').onclick = resetTimer;
    document.getElementById('timerBtn').onclick = toggleTimer;

    // Listen for updates from slides
    bc.onmessage = (event) => {
      const data = event.data;
      switch (data.type) {
        case 'slideUpdate':
          currentSlide = data.current - 1;
          totalSlides = data.total;
          slideTitle = data.title || '';
          if (data.notes) {
            speakerNotes = data.notes;
          }
          updateUI();
          break;
        case 'notesData':
          speakerNotes = data.notes;
          updateUI();
          break;
      }
    };

    // Request initial data from slides
    bc.postMessage({ type: 'requestSlideInfo' });
    bc.postMessage({ type: 'requestNotes' });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowLeft':
          prevSlide();
          break;
        case 'ArrowRight':
        case ' ':
          e.preventDefault();
          nextSlide();
          break;
      }
    });
  </script>
</body>
</html>
