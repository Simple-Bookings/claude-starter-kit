[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-starter-kit"
version = "2.0.0"
description = "Claude Starter Kit — Interactive learning for Claude Code workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Cura AI Team" }
]
keywords = ["claude", "ai", "cli", "learning", "workshop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Education",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/Simple-Bookings/claude-starter-kit"
Repository = "https://github.com/Simple-Bookings/claude-starter-kit"
Issues = "https://github.com/Simple-Bookings/claude-starter-kit/issues"

[project.scripts]
csk = "csk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["csk"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "csk/_data/templates"
"workshop" = "csk/_data/workshop"
"exercises" = "csk/_data/exercises"
".claude/agents" = "csk/_data/agents"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
